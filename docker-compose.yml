# Local stack: PostgreSQL, the API and the background worker.
#   cp .env.example .env   (fill in SECRET_KEY)
#   docker compose up --build
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      # Read by docker/initdb/01-app-role.sh
      APP_DB_NAME: spendroo
      APP_DB_USER: spendroo
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-spendroo}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spendroo -d spendroo"]
      interval: 5s
      timeout: 3s
      retries: 10

  web: &app
    build: .
    env_file: .env
    environment: &app-env
      PROJECT_ENVIRONMENT: development
      DEV_DATABASE_HOST: db
      DEV_DATABASE_PORT: "5432"
      DEV_DATABASE_NAME: spendroo
      DEV_DATABASE_USER: spendroo
      DEV_DATABASE_PASSWORD: ${APP_DB_PASSWORD:-spendroo}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - media:/app/Media_Files
      # The Firebase key (FCM_CREDENTIALS_FILE) and any other keys, read-only and never in the image
      - ./secrets:/app/secrets:ro

  worker:
    <<: *app
    command: python manage.py procrastinate worker
    ports: []
    depends_on:
      web:
        condition: service_started

volumes:
  pgdata:
  media:
